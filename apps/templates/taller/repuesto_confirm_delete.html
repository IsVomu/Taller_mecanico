{% extends 'base.html' %}
{% block content %}
<div class="card shadow col-md-6 mx-auto border-danger">
    <div class="card-body text-center">
        <h3 class="card-title text-danger">Confirmar Eliminación</h3>
        <p class="mt-3">¿Estás seguro de que deseas eliminar el repuesto <strong>"{{ object.nombre }}"</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'repuesto_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
