{% extends 'base.html' %}
{% block content %}
<div class="card shadow col-md-4 mx-auto">
    <div class="card-body">
        <h3 class="card-title text-center mb-3">Iniciar Sesión</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
